name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Lo que corre cualquier servicio de Nova: el formato, Checkstyle, las pruebas con las reglas de
  # arquitectura y la cobertura mínima. Una plantilla que no pasa esto no sirve de punto de partida.
  build:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-build-gradle.yml@main
    secrets: inherit

  # Cada commit del PR llega a main con el merge, así que se valida aquí; el hook local se puede saltar
  # con --no-verify.
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validar los mensajes de commit del PR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gradlew novaCommitLint --from="$BASE" --to="$HEAD"

  # Las dependencias del servicio contra las CVE conocidas, con el mirror de NVD de
  # nova-shared-02-pipelines; falla con un CVSS de 7 o más.
  owasp:
    if: github.event_name == 'pull_request'
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-owasp-check.yml@main
    with:
      build-tool: gradle
    secrets: inherit

  sbom:
    if: github.event_name == 'pull_request'
    # reusable-sbom.yml declara contents: write para adjuntar el SBOM a un release; sin este
    # permiso el workflow entero no llega a arrancar.
    permissions:
      contents: write
    uses: ahincho/nova-shared-02-pipelines/.github/workflows/reusable-sbom.yml@main
    with:
      build-tool: gradle
    secrets: inherit

  # La plantilla tiene que construir su imagen y arrancarla, no solo compilar: es lo que cada servicio
  # nuevo hereda. Ningún workflow reutilizable construye la imagen, así que este job vive aquí.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: nova-template-spring-boot-service:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Construir la imagen con el Dockerfile del toolchain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew novaDocker --tag="$IMAGE"
      - name: Arrancar la imagen y llamar a su API
        shell: bash
        run: |
          docker run --detach --name service --publish 8080:8080 "$IMAGE"
          up=no
          for attempt in $(seq 1 30); do
            if curl --silent http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'; then
              up=yes
              break
            fi
            sleep 2
          done
          if [ "$up" != yes ]; then
            echo "::error::El servicio no respondió UP en 60 segundos"
            exit 1
          fi
          echo "El servicio responde UP"
          # Una llamada que recorre el controlador, la validación y el servicio: si a la imagen le falta una
          # dependencia de ejecución, falla aquí y no en /actuator/health, que no pasa por ninguna capa.
          id=$(curl --fail --silent --show-error --request POST http://localhost:8080/v1/items \
            --header 'Content-Type: application/json' \
            --data '{"title": "Taza", "quantity": 3}' | jq --raw-output '.data.id')
          curl --fail --silent --show-error "http://localhost:8080/v1/items/$id" \
            | jq --exit-status '.success == true and .data.title == "Taza"'
      - name: Mostrar el log del servicio
        if: failure()
        run: docker logs service || true
      - name: Detener el contenedor
        if: always()
        run: docker rm --force service || true
